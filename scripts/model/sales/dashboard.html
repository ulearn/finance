        }

        .header {

            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            color: #333;

        .summary-card {

        function calculateMetrics(monthlyData, sessionType, averageMonths) {
            const session = sessionType === 'morning'
                ? { monthlyPrice: 420, grossProfit: 336, grossMargin: 80.0 }
                : { monthlyPrice: 360, grossProfit: 276, grossMargin: 76.67 };

            const monthly = monthlyData.map(m => {
                const mediaCAC = m.ads + m.software;
                const fullyLoadedCAC = mediaCAC + m.salaries + m.commissions;
                const cacPerCustomer = m.salesWon > 0 ? fullyLoadedCAC / m.salesWon : 0;
                const ltv = session.grossProfit * averageMonths;
                const ltvToCAC = cacPerCustomer > 0 ? ltv / cacPerCustomer : 0;

                return {
                    month: m.month,
                    mediaCAC,
                    fullyLoadedCAC,
                    salesWon: m.salesWon,
                    cacPerCustomer,
                    ltvToCAC
                };
            });

            const totals = {
                mediaCAC: monthly.reduce((s, m) => s + m.mediaCAC, 0),
                fullyLoadedCAC: monthly.reduce((s, m) => s + m.fullyLoadedCAC, 0),
                salesWon: monthly.reduce((s, m) => s + m.salesWon, 0),
                grossProfit: session.grossProfit,
                grossMargin: session.grossMargin,
                ltr: session.monthlyPrice * averageMonths,
                ltv: session.grossProfit * averageMonths
            };

            totals.avgCACPerCustomer = totals.salesWon > 0 ? totals.fullyLoadedCAC / totals.salesWon : 0;
            totals.avgLTVtoCAC = totals.avgCACPerCustomer > 0 ? totals.ltv / totals.avgCACPerCustomer : 0;

            return { monthly, totals };
        }
